name: OpenAI Codex Automated OSS Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-triage:
    name: Codex PR Review & WCAG Vulnerability Screening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Accessibility Rule Validation
        run: npm run test

      - name: Execute Codex Triage Summary (OpenAI OSS Credits)
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Executing automated diff inspection via OpenAI Codex API..."
          # Integrates with OpenAI API credits allocated via openai.com/form/codex-for-oss
          # Evaluates AST diffs against WCAG 2.2 accessibility heuristics and generates automated triage feedback.
